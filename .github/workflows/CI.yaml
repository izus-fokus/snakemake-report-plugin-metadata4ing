# .github/workflows/download-ontologies.yml
name: Download Ontologies

on:
  schedule:
    # Runs every day at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allows manual triggering

jobs:
  download-ontologies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create ontologies folder inside package
        run: mkdir -p src/snakemake_report_plugin_metadata4ing/ontologies

      - name: Download metadata4ing ontology
        run: |
          curl -fSL \
            https://git.rwth-aachen.de/nfdi4ing/metadata4ing/metadata4ing/-/raw/master/m4i2rocrate_context.jsonld \
            -o src/snakemake_report_plugin_metadata4ing/ontologies/metadata4ing.jsonld

      - name: Download QUDT unit ontology
        run: |
          curl -fSL \
            http://qudt.org/vocab/unit/ \
            -o src/snakemake_report_plugin_metadata4ing/ontologies/qudt.ttl

      - name: Commit & push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add src/snakemake_report_plugin_metadata4ing/ontologies/metadata4ing.jsonld \
                 src/snakemake_report_plugin_metadata4ing/ontologies/qudt.ttl
          git commit -m "Update ontologies [ci skip]" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
